<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Widget</title>
  <!-- Include Tailwind CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    /* Custom Dark Mode CSS */
    .dark-mode {
      background-color: #333;
      color: white;
    }

    .dark-mode .bg-white {
      background-color: #4a5568 !important;
    }

    .dark-mode .text-black {
      color: white !important;
    }
  </style>
</head>
<body class="transition duration-500">
  <div class="container mx-auto p-4 flex justify-center items-center min-h-screen">
    <div class="w-full max-w-md rounded-lg shadow-lg p-6 space-y-4 dark-mode:bg-gray-900 dark-mode:text-white transition duration-500">
      <!-- Weather Icon -->
      <div class="flex justify-center items-center mb-4">
        <img src="https://via.placeholder.com/150" alt="Weather Icon" class="rounded-full">
      </div>
      <!-- City Name and Temperature -->
      <h2 class="text-xl font-bold text-center">Mock City</h2>
      <p class="text-3xl font-semibold text-center">22°C</p>
      <!-- Weather Details -->
      <div class="flex justify-around">
        <div class="text-center">
          <p>Humidity: 50%</p>
          <p>Wind Speed: 10 km/h</p>
        </div>
        <!-- Dark Mode Toggle Switch -->
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" class="sr-only peer">
          <span class="w-11 h-6 bg-gray-300 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:bg-blue-600"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- JavaScript for Dark Mode Toggle -->
  <script>
    const toggleSwitch = document.querySelector('.peer');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
      document.documentElement.classList.toggle('dark-mode', currentTheme === 'dark');
      toggleSwitch.checked = currentTheme === 'dark';
    }
    function switchTheme(e) {
      if (e.target.checked) {
        document.documentElement.classList.add('dark-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark-mode');
        localStorage.setItem('theme', 'light');
      }
    }

    toggleSwitch.addEventListener('change', switchTheme, false);
  </script>
</body>
</html>
